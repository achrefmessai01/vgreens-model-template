# Reusable CI/CD for vGreens model repos. Included by each model's .gitlab-ci.yml,
# which sets MODEL_NAME / DATASET_NAME / DATASET_VERSION / CONFIG_PATH.
#
# Runs on the self-hosted CPU runner (sv01). Builds with kaniko (NO privileged
# Docker — safe on the shared host), scans with Trivy, produces a Syft SBOM, and
# — on a manual click — submits training to the Job API. CI never touches a GPU.
#
# Required project CI/CD variables:
#   VGREENS_API_URL   e.g. http://172.16.20.89:8000  (reachable from sv01)
#   VGREENS_CI_TOKEN  scoped API token, masked         (operator: submit jobs)
# The GPU host needs a one-time `docker login registry.gitlab.com` to pull images.

stages: [lint, test, build, security, submit]

# Every job runs on the self-hosted sv01 group runner (tag: sv01). This keeps all
# work — especially submit_training, which must reach the LAN Job API — off
# GitLab's shared cloud runners. Applies to every model repo that includes this
# template, so no per-project runner settings are needed.
default:
  tags: [vgreens-sv01-cpu]

variables:
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DATASET_VERSION: "v1"
  # Kaniko layer cache lives in a sibling repo in the same registry. The heavy
  # base + pip layers are built and pushed ONCE; later builds reuse them by
  # digest, so only the tiny code layer changes (build drops to ~1-2 min).
  CACHE_REPO: "$CI_REGISTRY_IMAGE/cache"

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff check .
  allow_failure: true

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet pytest pyyaml
    - if [ -d tests ]; then pytest -q; else echo "no tests/ — skipping"; fi

# Build + push the immutable image with kaniko (daemonless, unprivileged).
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    # Registry selection (opt-in): if the group variable LAN_REGISTRY is set, push
    # to the private LAN registry over the internal CA; otherwise keep gitlab.com.
    # The block is a no-op unless LAN_REGISTRY is defined, so it never changes the
    # default pipeline.
    - mkdir -p /kaniko/.docker /kaniko/ssl/certs
    - |
      if [ -n "$LAN_REGISTRY" ]; then
        echo "build -> LAN registry $LAN_REGISTRY"
        export IMAGE="$LAN_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
        export CACHE_REPO="$LAN_REGISTRY/$CI_PROJECT_PATH/cache"
        printf '%s\n' "$VGREENS_REGISTRY_CA" >> /kaniko/ssl/certs/additional-ca-cert-bundle.crt
        AUTH="$(printf '%s' "$VGREENS_REGISTRY_USER:$VGREENS_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$LAN_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
      else
        AUTH="$(printf '%s' "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE"
      --digest-file image.digest
      --cache=true
      --cache-repo "$CACHE_REPO"
      --cache-copy-layers=true
      --cache-ttl=336h
      --snapshot-mode=redo
      --use-new-run
      --compressed-caching=false
  artifacts:
    paths: [image.digest]
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Vulnerability scan — report always; fail only on CRITICAL (non-blocking for now).
trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [build]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --severity HIGH,CRITICAL --format table "$IMAGE" | tee trivy-report.txt
    - trivy image --severity CRITICAL --exit-code 1 "$IMAGE" || echo "CRITICAL findings — see trivy-report.txt"
  artifacts:
    paths: [trivy-report.txt]
    when: always
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Software bill of materials (CycloneDX). syft's own image is distroless (no shell),
# so we install the binary into a slim image that GitLab can run a script in.
sbom:
  stage: security
  image: python:3.12-slim
  needs: [build]
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: "$CI_REGISTRY"
    SYFT_REGISTRY_AUTH_USERNAME: "$CI_REGISTRY_USER"
    SYFT_REGISTRY_AUTH_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft "$IMAGE" -o cyclonedx-json=sbom.json -o table
  artifacts:
    paths: [sbom.json]
    when: always
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Manual gate: publish the job-config to the platform, then enqueue training with
# the exact built image. The API queues it for a GPU worker; CI never trains.
# Done in Python (stdlib urllib) so we can JSON-encode the YAML config safely —
# no jq/escaping gymnastics. Fails loudly on any non-2xx response.
submit_training:
  stage: submit
  image: python:3.12-slim
  when: manual
  needs: [build]
  script:
    # keep IMAGE in sync with the build job when the LAN registry is in use
    - |
      if [ -n "$LAN_REGISTRY" ]; then
        export IMAGE="$LAN_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA"
      fi
    - |
      python3 - <<'PY'
      import json, os, sys, urllib.request, urllib.error

      api = (os.environ.get("VGREENS_API_URL") or "").rstrip("/")
      tok = os.environ.get("VGREENS_CI_TOKEN")
      model = os.environ["MODEL_NAME"]
      if not api or not tok:
          sys.exit("VGREENS_API_URL / VGREENS_CI_TOKEN not set (check masked CI/CD variables)")

      def post(path, payload):
          req = urllib.request.Request(
              api + path, data=json.dumps(payload).encode(), method="POST",
              headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"{path} -> {r.status} {r.read().decode()[:200]}")
          except urllib.error.HTTPError as e:
              sys.exit(f"{path} -> {e.code} {e.read().decode()[:300]}")

      # 1. publish the job-config (hyperparameters + promotion thresholds) to the NAS
      with open(f"configs/{model}.yaml") as fh:
          post(f"/model-configs/{model}", {"content": fh.read()})
      # 2. enqueue training with the exact image CI just built
      post("/jobs", {
          "job_type": "training", "model_name": model,
          "dataset_name": os.environ["DATASET_NAME"],
          "dataset_version": os.environ.get("DATASET_VERSION", "v1"),
          "docker_image": os.environ["IMAGE"], "config_path": os.environ["CONFIG_PATH"],
      })
      PY
  rules:
    - if: '$CI_COMMIT_BRANCH'
